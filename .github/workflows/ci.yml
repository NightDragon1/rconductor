# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Three stages (scripts/ci-scope.sh decides):
#   1. every run: SPDX, Go lint, Go test, web lint and test, govulncheck
#   2. push to main and pull requests: integration, E2E, amd64 image
#   3. nightly, manual and tags: arm64 images and Minecraft, and everything
#      else regardless of paths
# E2E follows the changed paths; Minecraft also runs in stage 2 when RCON or
# profiles change. release.yml calls this before publishing; images are only
# built here, never pushed.
#
# The repository variable CI_RUNNER sets the runner of all jobs, for example
# ubuntu-latest. A self-hosted runner would run code of fork pull requests,
# so keep those to approved runs first.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Scope
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    outputs:
      stage2: ${{ steps.scope.outputs.stage2 }}
      stage3: ${{ steps.scope.outputs.stage3 }}
      e2e: ${{ steps.scope.outputs.e2e }}
      minecraft: ${{ steps.scope.outputs.minecraft }}
      sqlc: ${{ steps.scope.outputs.sqlc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: scripts/ci-scope.sh | tee -a "$GITHUB_OUTPUT"

  spdx:
    name: SPDX headers
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/check-spdx.sh

  go-lint:
    name: Go lint
    needs: scope
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ hashFiles('tools/go.sum', '.golangci.*') }}-${{ github.sha }}
          restore-keys: golangci-lint-${{ hashFiles('tools/go.sum', '.golangci.*') }}-
      - name: Generated code is up to date
        run: |
          go generate ./...
          git diff --exit-code
      - name: Queries and schema fit the generated code
        if: needs.scope.outputs.sqlc == 'true'
        run: docker run --rm -v "$PWD:/src" -w /src sqlc/sqlc:1.31.1 diff
      - run: go vet ./...
      - run: make lint

  go-test:
    name: Go test
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  govulncheck:
    name: govulncheck
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: go tool -modfile=tools/go.mod govulncheck -tags integration,minecraft ./...

  web:
    name: Web lint, test and build
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: API types are up to date
        run: |
          npm run gen:api
          git diff --exit-code -- src/api
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      # The E2E shards use this build instead of making their own.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui
          path: internal/webui/dist
          retention-days: 1

  # The three stage 2 names are required checks. A push to a branch must
  # not report them, or it satisfies the ruleset before the pull request's
  # run has finished.
  image:
    name: ${{ needs.scope.outputs.stage2 == 'true' && 'Image (amd64)' || 'Image (amd64) not due' }}
    needs: scope
    if: needs.scope.outputs.stage2 == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: panel
          platforms: linux/amd64
          tags: rconductor-panel:dev
          outputs: type=docker,dest=${{ runner.temp }}/panel.tar
          build-args: VERSION=0.0.0-ci+${{ github.sha }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max,ignore-error=true
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: agent
          platforms: linux/amd64
          tags: rconductor-agent:dev
          outputs: type=docker,dest=${{ runner.temp }}/agent.tar
          build-args: VERSION=0.0.0-ci+${{ github.sha }}
          cache-from: type=gha,scope=amd64
      # Integration loads these; E2E runs the panel without an image.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images
          path: ${{ runner.temp }}/*.tar
          retention-days: 1

  integration:
    name: ${{ needs.scope.outputs.stage2 == 'true' && 'Integration tests' || 'Integration tests not due' }}
    needs: [scope, image]
    if: needs.scope.outputs.stage2 == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
          path: ${{ runner.temp }}/images
      - run: |
          docker load --input "$RUNNER_TEMP/images/panel.tar"
          docker load --input "$RUNNER_TEMP/images/agent.tar"
      - run: scripts/pull-test-images.sh internal/integration
      - run: make integration-tests

  e2e-shard:
    name: E2E shard ${{ matrix.shard }}
    needs: [scope, web]
    if: needs.scope.outputs.stage2 == 'true' && needs.scope.outputs.e2e == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui
          path: internal/webui/dist
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('web/package-lock.json') }}
      - name: Browser and its libraries
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Tests
        working-directory: web
        env:
          SHARD: ${{ matrix.shard }}
        run: npx playwright test --shard="$SHARD/3"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  # One stable name for the ruleset: a skipped matrix job reports no check.
  e2e:
    name: ${{ needs.scope.outputs.stage2 == 'true' && 'E2E (Playwright)' || 'E2E (Playwright) not due' }}
    needs: [scope, e2e-shard]
    if: ${{ !cancelled() }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    steps:
      - env:
          DUE: ${{ needs.scope.outputs.stage2 == 'true' && needs.scope.outputs.e2e == 'true' }}
          RESULT: ${{ needs.e2e-shard.result }}
        run: |
          echo "due: $DUE, shards: $RESULT"
          [ "$DUE" != true ] || [ "$RESULT" = success ]

  image-arm64:
    name: Image (arm64) (${{ matrix.target }})
    needs: scope
    if: needs.scope.outputs.stage3 == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    strategy:
      matrix:
        target: [panel, agent]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/arm64
          push: false
          build-args: VERSION=0.0.0-ci+${{ github.sha }}
          cache-from: type=gha,scope=arm64-${{ matrix.target }}
          cache-to: type=gha,scope=arm64-${{ matrix.target }},mode=max,ignore-error=true

  minecraft:
    name: Minecraft walking skeleton
    needs: scope
    if: >-
      needs.scope.outputs.stage3 == 'true' ||
      (needs.scope.outputs.stage2 == 'true' && needs.scope.outputs.minecraft == 'true')
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The server JAR is pinned by version and SHA-1 in the script; the
      # cache key follows the script, so a new pin downloads again.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/minecraft
          key: minecraft-server-${{ hashFiles('scripts/minecraft-server.sh') }}
      - run: scripts/pull-test-images.sh internal/app
      # Running the test server means accepting the Minecraft EULA
      # (https://aka.ms/MinecraftEULA), see README.
      - run: make test-minecraft
        env:
          MINECRAFT_ACCEPT_EULA: "true"
