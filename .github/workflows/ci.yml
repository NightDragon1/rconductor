# SPDX-FileCopyrightText: 2026 NightDragon · ShadowGhost.NET
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Three stages (scripts/ci-scope.sh decides):
#   1. PR gates, every run that changes more than documentation: SPDX,
#      fitness, script tests, Go lint, Go test, web lint and test,
#      govulncheck, the amd64 image, acceptance tests and E2E by the changed
#      paths (Scope, SPDX with the acceptance checksums, Secret scan and PR
#      size run always; PR size only on pull requests and never red)
#   2. push to main, manual and tags: also integration tests (CodeQL on
#      main: codeql.yml)
#   3. nightly.yml, manual and tags: arm64 images, Minecraft, the long tests
#      and everything else regardless of paths
# Minecraft also runs in stage 2 when RCON or profiles change. A change of documentation alone runs only Scope, SPDX and
# the collecting jobs (PRJ-005); skipped jobs count as passed for the
# ruleset, so there is no paths filter on the workflow. release.yml calls this before publishing; images are only
# built here, never pushed.
#
# The repository variable CI_RUNNER sets the runner of all jobs, for example
# ubuntu-latest. A self-hosted runner would run code of fork pull requests,
# so keep those to approved runs first. Only this workflow reads the
# variable; release and the Docker Hub description have a fixed
# GitHub-hosted runner. PR size needs pull-requests: write, so a caller of
# this workflow grants it to its ci job (the job itself runs only on pull
# requests). A caller sets the input runner, which takes
# precedence over the variable; release.yml passes a fixed GitHub-hosted
# runner.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      runner:
        description: Runner of all jobs; takes precedence over the variable CI_RUNNER
        type: string
        required: false
        default: ""

permissions:
  contents: read

# No workspace file changes the modules the checks build with (PRJ-005).
env:
  GOWORK: "off"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Scope
    runs-on: ${{ inputs.runner || vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 5
    outputs:
      stage2: ${{ steps.scope.outputs.stage2 }}
      stage3: ${{ steps.scope.outputs.stage3 }}
      e2e: ${{ steps.scope.outputs.e2e }}
      minecraft: ${{ steps.scope.outputs.minecraft }}
      sqlc: ${{ steps.scope.outputs.sqlc }}
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: scripts/ci-scope.sh | tee -a "$GITHUB_OUTPUT"

  spdx:
    name: SPDX headers
    runs-on: ${{ inputs.runner || vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/check-spdx.sh
      # Every pull request, whatever its scope (NFR-019).
      - name: Acceptance checksums
        run: scripts/check-acceptance-sums.sh
      # The REUSE image by digest, not by tag (NFR-021); Renovate keeps it.
      - uses: docker://fsfe/reuse:6.0.0@sha256:71d7cb4e153b8765e93280398a3447b0ef13d6766a0420033dc333ddb2f6d368
        with:
          args: lint

  fitness:
    name: Fitness functions
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ${{ inputs.runner || vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go -C tools tool golangci-lint run ./fitness
      - run: go -C tools test ./fitness
      - run: go -C tools run ./fitness -dir ..
      # Scheduled and manual runs have no base to compare the list with, nor
      # a tag push (the release calls this workflow): its before is zero.
      - if: (github.event_name == 'pull_request' || github.event_name == 'push') && github.ref_type != 'tag'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: scripts/fitness-ratchet.sh "$BASE"

  scripts:
    name: Script tests
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ${{ inputs.runner || vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: scripts/ci-scope-test.sh
      - run: scripts/go-test-shard-test.sh
      - run: scripts/deny-rules-test.sh
      - run: scripts/format-hook-test.sh
      - run: scripts/claude-guard-test.sh
      - run: scripts/hook-scope-test.sh
      - run: scripts/check-secrets-test.sh
      - run: scripts/script-isolation-test.sh
      - run: scripts/pr-size-test.sh
      - run: scripts/check-acceptance-sums-test.sh
      - run: scripts/check-spdx-test.sh
      - run: scripts/check-tool-origin-test.sh
      - run: scripts/check-dockerfile-test.sh
      - run: scripts/fitness-ratchet-test.sh
      - run: scripts/release-test.sh
      - run: scripts/release-attest-test.sh
      - run: scripts/check-git-config-test.sh
      - run: scripts/lockfile-packages-test.sh
      - run: scripts/third-party-go-test.sh
      - run: go -C tools tool golangci-lint run ./claudeguard
      - run: go -C tools test -race ./claudeguard
        env:
          CGO_ENABLED: "1"

  go-lint:
    name: Go lint
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ${{ inputs.runner || vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ hashFiles('tools/go.sum', '.golangci.*') }}-${{ github.sha }}
          restore-keys: golangci-lint-${{ hashFiles('tools/go.sum', '.golangci.*') }}-
      - name: Generated code is up to date
        run: |
          go generate ./...
          git diff --exit-code
      - name: Queries and schema fit the generated code
        if: needs.scope.outputs.sqlc == 'true'
        run: docker run --rm -v "$PWD:/src" -w /src sqlc/sqlc:1.31.1@sha256:70f53171d27b2424e9358869975455a6e955a5aa8e58a998a270a6e34e525537 diff
      - run: go vet ./...
      # the control listener of the e2e stack exists only with the tag e2e
      - run: go vet -tags e2e ./internal/e2e/stack
      - run: make lint

  # scripts/go-test-shard.sh splits the packages and checks that its shard
  # count is the size of this matrix and that each job's shard is its job
  # index + 1, so the matrix is exactly 1 to N.
  go-test-shard:
    name: Go test shard ${{ matrix.shard }}
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ${{ inputs.runner || vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Every package is in exactly one shard
        env:
          TOTAL: ${{ strategy.job-total }}
          INDEX: ${{ strategy.job-index }}
          SHARD: ${{ matrix.shard }}
        run: scripts/go-test-shard.sh --check "$TOTAL" "$INDEX" "$SHARD"
      - name: Tests
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          pkgs=$(scripts/go-test-shard.sh "$SHARD")
          [ -n "$pkgs" ]
          # shellcheck disable=SC2086
          go test -race $pkgs

  # One stable name for the ruleset, as with E2E: the shards are always
  # due, so anything but success fails.
  go-test:
    name: Go test
    needs: [scope, go-test-shard]
    if: ${{ !cancelled() }}
    runs-on: ${{ inputs.runner || vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 5
    steps:
      - env:
          DUE: ${{ needs.scope.outputs.code == 'true' }}
          RESULT: ${{ needs.go-test-shard.result }}
        run: |
          echo "due: $DUE, shards: $RESULT"
          [ "$DUE" != true ] || [ "$RESULT" = success ]

  govulncheck:
    name: govulncheck
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ${{ inputs.runner || vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: go tool -modfile=tools/go.mod govulncheck -tags integration,minecraft ./...

  web:
    name: Web lint, test and build
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ${{ inputs.runner || vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      # web/package.json is no core path (PRJ-005): no lifecycle script of it
      # runs, and the core checks start with node, not npm (no npm config),
      # before any npm script; ESLint and openapi-typescript take a fixed
      # config only (-c, --redocly), no lookup in web/.
      - run: sh ../scripts/check-tool-origin.sh ..
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: node node_modules/eslint/bin/eslint.js -c eslint.config.js .
      - run: node scripts/fitness-render.ts
      - run: sh scripts/fitness-render-test.sh
      - name: API types are up to date
        run: |
          node node_modules/openapi-typescript/bin/cli.js --redocly scripts/fitness-render-redocly.yaml \
            ../api/openapi.yaml -o src/api/schema.d.ts
          git diff --exit-code -- src/api
      - run: node node_modules/prettier/bin/prettier.cjs --check .
      - run: node node_modules/vitest/vitest.mjs run --config vite.config.ts
      - run: sh ../scripts/web-build.sh
      # The image builds the UI the same way; Dockerfile and .dockerignore
      # change only together with the checksum of the core script.
      - run: sh ../scripts/check-dockerfile.sh ..
      # The E2E shards use this build instead of making their own.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui
          path: internal/webui/dist
          retention-days: 1

  # Pull requests build the image too: the acceptance tests run on it.
  image:
    # Static names: a skipped job reports its name unevaluated, and the
    # ruleset needs these names also when documentation alone skips them.
    name: Image (amd64)
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ${{ inputs.runner || vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: panel
          platforms: linux/amd64
          tags: rconductor-panel:dev
          outputs: type=docker,dest=${{ runner.temp }}/panel.tar
          build-args: VERSION=0.0.0-ci+${{ github.sha }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max,ignore-error=true
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: agent
          platforms: linux/amd64
          tags: rconductor-agent:dev
          outputs: type=docker,dest=${{ runner.temp }}/agent.tar
          build-args: VERSION=0.0.0-ci+${{ github.sha }}
          cache-from: type=gha,scope=amd64
      # Integration loads these; E2E runs the panel without an image.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images
          path: ${{ runner.temp }}/*.tar
          retention-days: 1

  integration:
    name: Integration tests
    needs: [scope, image]
    if: needs.scope.outputs.stage2 == 'true' && needs.scope.outputs.code == 'true'
    runs-on: ${{ inputs.runner || vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
          path: ${{ runner.temp }}/images
      - run: |
          docker load --input "$RUNNER_TEMP/images/panel.tar"
          docker load --input "$RUNNER_TEMP/images/agent.tar"
      - run: scripts/pull-test-images.sh internal/integration
      - run: make integration-tests

  # Black-box tests of the acceptance criteria against panel and agent from
  # the images, started with deploy/compose/all-in-one.yaml (NFR-019).
  acceptance:
    name: Acceptance tests
    needs: [scope, image]
    if: needs.scope.outputs.code == 'true'
    runs-on: ${{ inputs.runner || vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
          path: ${{ runner.temp }}/images
      - run: |
          docker load --input "$RUNNER_TEMP/images/panel.tar"
          docker load --input "$RUNNER_TEMP/images/agent.tar"
      - run: scripts/acceptance-run.sh -v

  # Secret scan (SEC-012): a pull request scans its diff, a push to main the
  # commits of the push, every other run (nightly, manual, release) the full
  # history of the checked-out commit only, not the other branches the
  # checkout fetches. gitleaks (MIT) as release binary, pinned by checksum.
  # Known test values: .gitleaksignore or the comment gitleaks:allow. The
  # log lists each finding by rule, file and commit, never its value.
  secrets:
    name: Secret scan
    runs-on: ${{ inputs.runner || vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          tgz=$RUNNER_TEMP/gitleaks.tar.gz
          curl -fsSL --retry 3 -o "$tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v$VERSION/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "$SHA256  $tgz" | sha256sum --strict -c -
          tar -xzf "$tgz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          report=$RUNNER_TEMP/gitleaks.json
          opts=(--no-banner --redact --report-format json --report-path "$report")
          rc=0
          if [ "$EVENT" = pull_request ]; then
            git diff --merge-base "$BASE" HEAD | "$RUNNER_TEMP/gitleaks" stdin "${opts[@]}" || rc=$?
          elif [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ] && [ -n "$BEFORE" ] &&
            [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            "$RUNNER_TEMP/gitleaks" git "${opts[@]}" --log-opts="$BEFORE..HEAD" . || rc=$?
          else
            "$RUNNER_TEMP/gitleaks" git "${opts[@]}" --log-opts=HEAD . || rc=$?
          fi
          if [ -s "$report" ]; then
            jq -r 'def or_diff: if (. // "") == "" then "diff" else . end;
              .[] | "::error::\(.RuleID) in \(.File | or_diff):\(.StartLine) commit \(.Commit | or_diff)"' "$report"
          fi
          exit "$rc"

  # Size of each pull request (PRJ-005): scripts/pr-size.sh counts the
  # changed lines without generated files (.github/core-paths.yml) and sets
  # the label over-limit above 400 lines, with a warning. It only informs
  # and never fails the run. A fork pull request gets the warning only: its
  # token cannot label.
  pr-size:
    name: PR size
    if: github.event_name == 'pull_request'
    runs-on: ${{ inputs.runner || vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Count and label
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -uo pipefail
          files=$RUNNER_TEMP/files.tsv out=$RUNNER_TEMP/size.out
          if ! gh api --paginate "repos/$GH_REPO/pulls/$PR/files" \
            --jq '.[] | [.status, .additions, .deletions, .filename, (.previous_filename // "")] | @tsv' >"$files"; then
            echo "::warning::file list not readable, size unknown"
            exit 0
          fi
          gh pr view "$PR" --json labels --jq '.labels[].name' |
            scripts/pr-size.sh .github/core-paths.yml "$files" >"$out" || true
          lines=$(sed -n 's/^lines=//p' "$out")
          size=$(sed -n 's/^size=//p' "$out")
          mapfile -t args < <(grep -E '^--(add|remove)-label$|^over-limit' "$out")
          if [ "$FORK" != true ] && [ "${#args[@]}" -gt 0 ]; then
            gh pr edit "$PR" "${args[@]}" || echo "::warning::labels not set"
          fi
          echo "changed lines without generated files: ${lines:-unknown} (limit 400)" >>"$GITHUB_STEP_SUMMARY"
          if [ "$size" = over ]; then
            echo "::warning::$lines changed lines without generated files (limit 400): split it or give the reason in the PR text"
          fi
          exit 0

  e2e-shard:
    name: E2E shard ${{ matrix.shard }}
    needs: [scope, web]
    if: needs.scope.outputs.e2e == 'true' && needs.scope.outputs.code == 'true'
    runs-on: ${{ inputs.runner || vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 30
    # Browser and its libraries come with the image; its version follows
    # @playwright/test (renovate.json). The stack needs no Docker.
    container: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui
          path: internal/webui/dist
      - name: Web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Tests
        working-directory: web
        env:
          SHARD: ${{ matrix.shard }}
        run: node node_modules/@playwright/test/cli.js test --config playwright.config.ts --shard="$SHARD/3"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  # One stable name for the ruleset: a skipped matrix job reports no check.
  e2e:
    name: E2E (Playwright)
    needs: [scope, e2e-shard]
    if: ${{ !cancelled() }}
    runs-on: ${{ inputs.runner || vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 5
    steps:
      - env:
          DUE: ${{ needs.scope.outputs.e2e == 'true' && needs.scope.outputs.code == 'true' }}
          RESULT: ${{ needs.e2e-shard.result }}
        run: |
          echo "due: $DUE, shards: $RESULT"
          [ "$DUE" != true ] || [ "$RESULT" = success ]

  image-arm64:
    name: Image (arm64) (${{ matrix.target }})
    needs: scope
    if: needs.scope.outputs.stage3 == 'true'
    runs-on: ${{ inputs.runner || vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 45
    strategy:
      matrix:
        target: [panel, agent]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/arm64
          push: false
          build-args: VERSION=0.0.0-ci+${{ github.sha }}
          cache-from: type=gha,scope=arm64-${{ matrix.target }}
          cache-to: type=gha,scope=arm64-${{ matrix.target }},mode=max,ignore-error=true

  long-tests:
    name: Long tests
    needs: scope
    if: needs.scope.outputs.stage3 == 'true'
    runs-on: ${{ inputs.runner || vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make measure-login

  minecraft:
    name: Minecraft walking skeleton
    needs: scope
    if: >-
      needs.scope.outputs.stage3 == 'true' ||
      (needs.scope.outputs.stage2 == 'true' && needs.scope.outputs.minecraft == 'true')
    runs-on: ${{ inputs.runner || vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The server JAR is pinned by version and SHA-1 in the script; the
      # cache key follows the script, so a new pin downloads again.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/minecraft
          key: minecraft-server-${{ hashFiles('scripts/minecraft-server.sh') }}
      - run: scripts/pull-test-images.sh internal/app
      # Running the test server means accepting the Minecraft EULA
      # (https://aka.ms/MinecraftEULA), see README.
      - run: make test-minecraft
        env:
          MINECRAFT_ACCEPT_EULA: "true"
