#
# Nightly on main (PRJ-005, NFR-021):
#   - ci.yml in full: E2E without path filter, arm64 images, Minecraft and
#     the long tests (stage 3);
#   - image scan of panel and agent (amd64) with Grype, failing on high and
#     critical findings that have a fix, and an SBOM of each image;
#   - watchdog: fails when a workflow run on main ended red or hangs. Runs
#     of release.yml are left out (filtered by their name "Release"); they
#     wait for the approval of the environment and are watched there.
name: Nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  scan:
    name: Image scan and SBOM (${{ matrix.target }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [panel, agent]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: true
          tags: rconductor-${{ matrix.target }}:nightly
          build-args: VERSION=0.0.0-nightly+${{ github.sha }}
          cache-from: type=gha,scope=amd64
      - id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: SBOM
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          TARGET: ${{ matrix.target }}
        run: '"$SYFT" scan -o "spdx-json=rconductor-$TARGET.spdx.json" "docker:rconductor-$TARGET:nightly"'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.target }}
          path: rconductor-*.spdx.json
          retention-days: 14
      - uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: rconductor-${{ matrix.target }}:nightly
          severity-cutoff: high
          only-fixed: true
          output-format: table

  watchdog:
    name: Watchdog
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Red or hanging runs on main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # Look back one day; a run longer than this hangs.
          SINCE_HOURS: "24"
          HANG_HOURS: "6"
          SELF: ${{ github.run_id }}
        run: |
          set -euo pipefail
          since=$(date -u -d "-$SINCE_HOURS hours" +%Y-%m-%dT%H:%M:%SZ)
          hang=$(date -u -d "-$HANG_HOURS hours" +%s)
          gh api --paginate "repos/$GH_REPO/actions/runs?branch=main&created=>=$since&per_page=100" \
            --jq '.workflow_runs[] | select(.name != "Release" and (.id | tostring) != env.SELF) |
              [.id, .name, .status, (.conclusion // ""), .created_at, .html_url] | @tsv' >runs.tsv
          bad=0
          while IFS=$'\t' read -r _ name status conclusion created url; do
            case "$status:$conclusion" in
              completed:failure | completed:timed_out | completed:startup_failure)
                echo "::error::red: $name ($conclusion) $url"; bad=1 ;;
              queued:* | in_progress:* | waiting:* | pending:*)
                if [ "$(date -u -d "$created" +%s)" -lt "$hang" ]; then
                  echo "::error::hangs since $created: $name $url"; bad=1
                fi ;;
            esac
          done <runs.tsv
          echo "runs on main since $since (without Release and this run): $(wc -l <runs.tsv)" >>"$GITHUB_STEP_SUMMARY"
          exit "$bad"
