#
# Size of each pull request (PRJ-005): scripts/pr-size.sh counts the changed
# lines without generated files (.github/core-paths.yml) and sets the label
# over-limit above 400 lines, with a warning. It only informs and never
# fails the run.
#
# pull_request_target runs this file and the script of the base branch with
# a token that can label. Hard rules for this file:
#   - no checkout of the pull request head, only of the base branch;
#   - no code of the pull request runs; its file list is read as data;
#   - no secrets; only the job token with the permissions below;
#   - values from the pull request reach run scripts only through env.
name: PR size

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-size-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  size:
    name: PR size
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
      - name: Count and label
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          files=$RUNNER_TEMP/files.tsv out=$RUNNER_TEMP/size.out
          if ! gh api --paginate "repos/$GH_REPO/pulls/$PR/files" \
            --jq '.[] | [.status, .additions, .deletions, .filename, (.previous_filename // "")] | @tsv' >"$files"; then
            echo "::warning::file list not readable, size unknown"
            exit 0
          fi
          gh pr view "$PR" --json labels --jq '.labels[].name' |
            scripts/pr-size.sh .github/core-paths.yml "$files" >"$out" || true
          lines=$(sed -n 's/^lines=//p' "$out")
          size=$(sed -n 's/^size=//p' "$out")
          mapfile -t args < <(grep -E '^--(add|remove)-label$|^over-limit' "$out")
          if [ "${#args[@]}" -gt 0 ]; then gh pr edit "$PR" "${args[@]}" || echo "::warning::labels not set"; fi
          echo "changed lines without generated files: ${lines:-unknown} (limit 400)" >>"$GITHUB_STEP_SUMMARY"
          if [ "$size" = over ]; then
            echo "::warning::$lines changed lines without generated files (limit 400): split it or give the reason in the PR text"
          fi
          exit 0
