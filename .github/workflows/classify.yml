#
# Review stage of each pull request (PRJ-005): scripts/classify.sh decides
# from the changed files and .github/core-paths.yml, the job Classify sets
# the label stage-1 or stage-2. It is meant as a required check: it fails
# when a stage 2 pull request has auto-merge on, also after a later push,
# a change of the base or when auto-merge is turned on. The job token
# cannot turn auto-merge off. Classify also sets the size labels:
# over-limit for a stage 2 pull request over 400 changed lines of code,
# over-limit-tests when tests alone take it over 400 (tests are the list
# "tests" of the class file; generated files and lockfiles never count).
# The job Line limit only warns about an overrun, with the counts in the
# summary; it fails when the count is unknown (Classify did not finish).
#
# pull_request_target runs this file and the scripts of the base branch
# with a token that can label. Hard rules for this file:
#   - no checkout of the pull request head, only of the base branch;
#   - no code of the pull request runs; its file list is read as data;
#   - no secrets; only the job token with the permissions below;
#   - values from the pull request reach run scripts only through env,
#     never through expressions inside run.
name: Classify

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, auto_merge_enabled, auto_merge_disabled]

permissions:
  contents: read

concurrency:
  group: classify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      size: ${{ steps.classify.outputs.size }}
      lines: ${{ steps.classify.outputs.lines }}
      code: ${{ steps.classify.outputs.code }}
      tests: ${{ steps.classify.outputs.tests }}
    # Write only in this job: it sets the label (PRJ-005).
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The current tip of the base branch, never the head of the pull
      # request. base.sha can be older than the class file and the script
      # (it stays at the commit the pull request was opened on).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
      - name: Classify and label
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          files=$RUNNER_TEMP/files.tsv out=$RUNNER_TEMP/classify.out
          rc=0 stage= broken=
          if gh api --paginate "repos/$GH_REPO/pulls/$PR/files" \
            --jq '.[] | [.status, .additions, .deletions, .filename, (.previous_filename // "")] | @tsv' >"$files"; then
            scripts/classify.sh .github/core-paths.yml "$files" >"$out" || rc=$?
            cat "$out"
            stage=$(sed -n 's/^stage=//p' "$out")
            # The API lists at most 3000 files; a longer list is incomplete.
            if [ "$(wc -l <"$files")" -ge 3000 ]; then
              echo "::error::file list incomplete, counted as stage 2"
              rc=1 stage= broken=1
            fi
          else
            echo "::error::file list not readable, counted as stage 2"
            rc=1 broken=1
          fi
          # Anything but a clear stage-1 counts as stage 2.
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then stage= broken=1; fi
          case "$stage" in
            stage-1) other=stage-2 ;;
            *) stage=stage-2 other=stage-1 ;;
          esac
          size=
          if [ -z "$broken" ]; then size=$(sed -n 's/^size=//p' "$out"); fi
          args=(--add-label "$stage")
          labels=$(gh pr view "$PR" --json labels --jq '.labels[].name')
          has() { printf '%s\n' "$labels" | grep -qxF "$1"; }
          if has "$other"; then args+=(--remove-label "$other"); fi
          # Size labels like the stage labels; an unknown size keeps them.
          mapfile -t sizeargs < <(printf '%s\n' "$labels" | scripts/classify-size.sh "$size")
          args+=("${sizeargs[@]}")
          gh pr edit "$PR" "${args[@]}"
          echo "review stage: $stage, size: ${size:-unknown}"
          # The counts go to the job Line limit; an overrun fails nothing here.
          if [ -n "$size" ]; then
            {
              echo "size=$size"
              echo "lines=$(sed -n 's/^lines=//p' "$out")"
              echo "code=$(sed -n 's/^code_lines=//p' "$out")"
              echo "tests=$(sed -n 's/^test_lines=//p' "$out")"
            } >>"$GITHUB_OUTPUT"
          fi
          # Auto-merge as it is now, not as the event saw it; unreadable
          # counts as on.
          auto=$(gh pr view "$PR" --json autoMergeRequest --jq '.autoMergeRequest != null' || echo true)
          if [ "$stage" = stage-2 ] && [ "$auto" != false ]; then
            echo "::error::stage 2 pull request with auto-merge on; turn auto-merge off, the maintainer merges"
            exit 1
          fi
          # A list that could not be read or a broken class file fails too.
          if [ -n "$broken" ]; then exit 1; fi
          exit 0

  line-limit:
    name: Line limit
    needs: classify
    # Also when Classify failed, so that an overrun shows at once.
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      # The scripts of the base branch, never of the pull request.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
      - name: At most 400 changed lines of code in stage 2
        env:
          SIZE: ${{ needs.classify.outputs.size }}
          LINES: ${{ needs.classify.outputs.lines }}
          CODE: ${{ needs.classify.outputs.code }}
          TESTS: ${{ needs.classify.outputs.tests }}
        run: scripts/line-limit.sh "$SIZE" "$LINES" "$CODE" "$TESTS" "$GITHUB_STEP_SUMMARY"
