#
# Class file of the core paths (PRJ-005): a pull request whose diff touches
# one of these paths is a core PR (stage 2); scripts/classify.sh decides it
# and the workflow classify.yml labels the pull request.
#
# Fixed format, read by scripts/classify.sh without a YAML parser:
#   - a line "<area>:" at column 0 starts the list of an area;
#   - each "  - <glob>" below it adds a glob, relative to the repository root;
#   - comments ("#" at the line start) and blank lines are ignored;
#   - any other line is an error.
# Glob: "**" matches any number of directories (also none), "*" any
# characters within one path segment, "?" one character other than "/".
# A glob must not start with "*" (YAML would read it as an alias).
# The list "generated" holds generated files: they never decide the stage
# and do not count toward the size limit of 400 changed lines. The list
# "tests" holds tests: they decide the stage like any file, but count apart,
# so that an overrun through tests alone shows as over-limit-tests.

# authz: rights, sessions, login, and the API middleware that enforces them
authz:
  - internal/perm/**
  - internal/auth/**
  - internal/web/api.go
  - internal/web/web.go
  - internal/users/assignments.go
  - internal/users/groups.go
# the queries that write what the rights check reads (lists, assignments,
# groups), as perm.sql reads it
  - internal/store/queries/sqlite/commandlists.sql
  - internal/store/queries/sqlite/assignments.sql
  - internal/store/queries/sqlite/groups.sql
  - internal/store/queries/sqlite/users.sql
# the operations allowed while the second factor is being set up
  - internal/web/api_secondfactor.go
# who sees which message (MSG-001, MSG-002), with the handlers and the
# request (actor) they hand to the service
  - internal/messages/**
  - internal/store/queries/sqlite/messages.sql
  - internal/web/api_messages.go
  - internal/web/api_users.go
# the session with the role and lock the pipeline is handed
  - internal/store/queries/sqlite/sessions.sql
# who of the open connections gets a message event (MSG-001, D-085)
  - internal/events/hub.go
# how a broken security setting is read: switches stay on, numbers keep the
# last value (F-93, D-109)
  - internal/store/settings.go

# cmd: commands from input to game server, and the orders the agent executes,
# with the profile rules and queries that decide what is checked and sent
cmd:
  - internal/commands/**
  - internal/rcon/**
  - internal/connmgr/**
  - internal/agentproto/**
  - internal/agent/docker.go
# the profile rules the pipeline checks against and builds with
  - internal/profiles/profile.go
  - internal/profiles/effective.go
  - internal/profiles/forserver.go
  - internal/profiles/importer.go
  - internal/profiles/presence.go
# the tests of the profile rules (D-074, D-076), so that no stage-1 change
# weakens them
  - internal/profiles/effective_test.go
  - internal/profiles/combination_test.go
  - internal/profiles/slash_test.go
  - internal/profiles/profile_test.go
  - internal/profiles/message_test.go
  - internal/profiles/c7_test.go
# the queries the pipeline and its rights check run
  - internal/store/queries/sqlite/perm.sql
  - internal/store/queries/sqlite/audit.sql
  - internal/store/queries/sqlite/settings.sql
  - internal/store/queries/sqlite/profiles.sql
  - internal/store/queries/sqlite/servers.sql
  - internal/store/queries/sqlite/commands.sql
  - internal/store/queries/sqlite/templates.sql

# render: foreign data (SEC-006) shown in the UI
render:
  - internal/foreign/**
  - web/src/components/ForeignText.tsx
  - web/src/lib/foreign.ts
  - web/src/lib/formatting.ts

# redact: no secrets in logs (SEC-012), masking of container logs (UI-022)
redact:
# the whole logging package: a new file there reaches the handler and its
# blacking out (SEC-012)
  - internal/logging/**
  - internal/logmask/**
  - internal/agentview/logs.go
  - internal/servers/logs.go
# the raw sources of container logs before the masking (UI-022)
  - internal/agentview/agentview.go
  - internal/cache/agents.go
# the system log and the diagnostic export, blacked out before writing (D-090, D-091)
  - internal/diag/**
  - internal/syslog/**
  - internal/store/queries/sqlite/systemlog.sql

# audit: audit log and the fixed event codes
audit:
  - internal/audit/**
  - internal/users/auditlog.go
  - internal/logging/events.go

# input: parsing and limits of untrusted input
input:
  - internal/pattern/**
  - internal/web/headers.go
  - internal/web/api_multi.go
  - internal/netlimit/**
  - internal/profiles/check.go

# boundary: API contract, database schema and CI
boundary:
  - api/**
# the hand-written code of the generated API package, such as how request
# bodies decode; api.gen.go itself is generated and decides nothing
  - internal/api/**
  - migrations/**
  - .github/**

# rules: rule files, hooks, guard and release scripts, and the scripts and
# test data that decide whether a check runs at all (stage, CI scope, shards),
# and the files that steer what the checked tools and the bundler read
rules:
  - CLAUDE.md
  - CONTRIBUTING.md
  - .claude/**
  - .githooks/**
  - scripts/release*
  - tools/claudeguard/**
  - tools/fitness/**
  - scripts/fitness-ratchet.sh
  - web/eslint.config.js
  - web/scripts/fitness-render*
  - web/scripts/testdata/**
  - scripts/classify*
  - scripts/line-limit.sh
  - scripts/ci-scope*
  - scripts/go-test-shard*
  - .npmrc
  - web/.npmrc
  - web/redocly.*
  - web/.redocly.*
  - web/index.html
  - web/vite.config.*
  - web/playwright.config.ts
  - web/src/test/pseudo.ts
  - .golangci.*
  - scripts/check-tool-origin.sh
  - scripts/web-build.sh
  - scripts/check-tool-origin-test.sh
  - scripts/check-dockerfile*
  - Makefile
# the license check: what reuse lint asks for (NFR-021)
  - REUSE.toml
  - .reuse/**
  - LICENSES/**
  - scripts/check-spdx.sh
# which query files sqlc generates the database code from
  - sqlc.yaml

# generated: output of oapi-codegen, sqlc and openapi-typescript, and the
# lockfiles
generated:
  - internal/api/api.gen.go
  - internal/store/sqlitedb/*.sql.go
  - internal/store/sqlitedb/db.go
  - internal/store/sqlitedb/models.go
  - web/src/api/schema.d.ts
# Lockfiles: the PR text lists the packages they add (name@version and
# origin) and the changed origins or checksums, as scripts/lockfile-packages.py
# prints them; that list is reviewed instead of the diff.
  - go.sum
  - tools/go.sum
  - web/package-lock.json

# tests: test code and test data; counted apart from the code (PRJ-005)
tests:
  - internal/**/*_test.go
  - cmd/**/*_test.go
  - tools/**/*_test.go
  - internal/**/testdata/**
  - tools/**/testdata/**
  - web/src/**/*.test.ts
  - web/src/**/*.test.tsx
  - web/e2e/**
  - web/scripts/testdata/**
  - scripts/*-test.sh
  - web/scripts/*-test.sh
