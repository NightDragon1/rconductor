#
# The panel host of the separate variant (Design 5.4). RCD_AGENT_PUBLIC_ADDR
# is the address agents reach the panel under; it goes into pairing tokens.
services:
  panel:
    image: ghcr.io/nightdragon1/rconductor-panel:1
    restart: unless-stopped
    read_only: true
    ports:
      - "${RCD_WEB_PORT:-8080}:8080"
      - "${RCD_AGENT_PORT:-8443}:8443"
    environment:
      RCD_AGENT_PUBLIC_ADDR: "${RCD_AGENT_PUBLIC_ADDR:-}"
    volumes:
      - data:/data
      - secrets:/secrets
      - backups:/backups
volumes:
  data:
  secrets:
  backups:
