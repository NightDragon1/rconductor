        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "409":
          description: The agent does not report the capability for it (agent_unsupported, AGT-013); only an update of the agent helps.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: The agent or Docker refused the action (action_failed).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: No agent connected (agent_unavailable) or no RCON connection (server_unavailable).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "504":
          description: The agent or the game server did not answer in time.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /servers/{id}/logs:
    parameters:
