      summary: The caller's own profile (AUTH-009).
      tags: [profile]
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    patch:
      operationId: updateMe
      summary: Change pseudonym, real name or contacts (AUTH-009).
      description: The emergency admin keeps his pseudonym.
      tags: [profile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: The changed profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/Invalid"
  /me/favorites:
    get:
      operationId: getFavorites
      summary: The caller's favorite servers for the console (CMD-001).
      description: Servers that left the caller's scope are left out.
      tags: [profile]
      responses:
        "200":
          description: The favorites in order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Favorites"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    put:
      operationId: setFavorites
      summary: Replace the caller's favorite servers.
      description: Only servers in the caller's scope, at most 50, in the given order.
      tags: [profile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Favorites"
      responses:
        "200":
          description: The favorites now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Favorites"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/Invalid"
  /me/password:
    post:
      operationId: changePassword
      summary: Change the own password (AUTH-007).
      description: >-
        The old password, also the initial password, is invalid at once;
        all other sessions of the user end.
      tags: [profile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "204":
          description: Changed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Busy"
  /me/avatar:
    put:
      operationId: setMyAvatar
      summary: Upload the own profile picture (AUTH-009).
      description: >-
        PNG or JPEG, at most 1 MiB and 4096 × 4096 pixels; checked by
        content, re-encoded without metadata and scaled to at most
        512 × 512.
      tags: [profile]
      requestBody:
        required: true
        description: The image; its type is taken from the content, not from the header.
        content:
          image/*:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: Stored.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/Invalid"
    delete:
      operationId: deleteMyAvatar
      summary: Remove the own profile picture.
      tags: [profile]
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /users/{id}/password-reset:
    parameters:
      - $ref: "#/components/parameters/UserID"
    post:
      operationId: resetPassword
      summary: Set a temporary password for a managed user (AUTH-010).
      description: >-
        The temporary password is in this answer only, never in log or
        audit; the user must change it at the next login, and all his
        sessions end.
      tags: [users]
      responses:
        "200":
          description: The temporary password, shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordReset"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Busy"
  /users/{id}/sessions:
    parameters:
      - $ref: "#/components/parameters/UserID"
    delete:
      operationId: endUserSessions
      summary: End all sessions of a managed user (AUTH-006).
      description: >-
        Whoever manages the user ends his sessions and closes his
        WebSockets at once; audited, logged as auth.session.revoked
        (revision 2.4 candidate 21).
      tags: [users]
      responses:
        "204":
          description: All sessions ended.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /users/{id}/avatar:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      operationId: getUserAvatar
      summary: Profile picture of a user (AUTH-009, decision W4).
      description: >-
        For the user himself, the RCON admin and whoever manages him.
        Served with nosniff and a Content-Security-Policy that allows
        nothing.
      tags: [profile]
      responses:
        "200":
          description: The picture.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /audit:
    get:
      operationId: listAudit
      summary: Audit log, newest first (AUD-001, AUD-004).
      description: >-
        RCON admin: everything. Server admin: entries about servers in his
        scope, about users he manages and his own actions. Others: 403.
        Cursor-based paging (Design 2.1).
      tags: [audit]
      parameters:
        - name: kind
          in: query
          schema:
            type: string
            enum: [command, agent, admin, auth]
        - name: server_id
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 256
      responses:
        "200":
          description: A page of entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Invalid"
  /settings:
    get:
      operationId: getSettings
      summary: Global settings (Design 5.1); RCON admin only.
      tags: [settings]
      responses:
        "200":
          description: All global settings.
          headers:
            ETag:
              description: Version of the settings for If-Match (revision 2.4 candidate 24).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      operationId: updateSettings
      summary: Change global settings; RCON admin only (AUD-003).
      description: >-
        Only known keys with valid values, all or nothing; for example
        audit.retention_days, supporters.enabled, session.idle_timeout.
        Switching supporters off ends the sessions of all supporters.
      tags: [settings]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Settings"
      responses:
        "409":
          $ref: "#/components/responses/Conflict"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "200":
          description: All global settings after the change.
          headers:
            ETag:
              description: Version of the settings for If-Match (revision 2.4 candidate 24).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Invalid"

  /settings/smtp:
    get:
      operationId: getSMTPSettings
      summary: The SMTP server for the panel's mail (NFR-017); RCON admin only.
      description: >-
        The password is never returned, only whether one is set.
      tags: [settings]
      responses:
        "200":
          description: The SMTP setup.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SMTPSettings"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: updateSMTPSettings
      summary: Change the SMTP setup; RCON admin only (NFR-017).
      description: >-
        Missing fields stay. The password is write-only and sealed with the
        master key like RCON credentials (SRV-002); an empty one removes it,
        a new host or port keeps it (D-050). User and password only with
        starttls or ssl. Every change is audited without the password.
      tags: [settings]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SMTPSettingsInput"
      responses:
        "200":
          description: The SMTP setup after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SMTPSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Invalid"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  /settings/smtp/test:
    post:
      operationId: testSMTP
      summary: Send the fixed test mail to a recipient; RCON admin only (NFR-017).
      description: >-
        Subject and text are fixed. With starttls and ssl the certificate is
        checked, and starttls never falls back to plain text. A failure
        names only its category. At most smtp.test_per_minute per user and
        minute (429).
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SMTPTestInput"
      responses:
        "200":
          description: Sent, or the category of the failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SMTPTestResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/RateLimited"

components:
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: >-
        The version read before (version field, or ETag of /settings).
        Required for these writes: without it the answer is 428
        precondition_required, after the role check. If it is not the
        current one, the change is refused with 409 conflict and nothing
        is written; the database checks and raises the version in one
        statement (revision 2.4 candidate 24). Optional in this file only
        so that the role check comes first: a required header would be
        refused by the generated wrapper with 400 before role and scope
        are checked (D-051). x-rcd-required-by-server marks it as required
        by the panel; web/src/api/client.ts (patchVersioned) and
        internal/app/rights_test.go (TestIfMatchRequiredFromSpec) follow it.
      x-rcd-required-by-server: true
      schema:
        type: string
        maxLength: 128
    AgentID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ServerID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TemplateID:
      name: template_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ServerGroupID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InviteID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CommandListID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GroupID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    Agent:
      type: object
      required: [id, name, fingerprint, status, version, capabilities, connected, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Foreign data from the agent (SEC-006).
        fingerprint:
          type: string
          description: SHA256:<base64> of the agent key.
        status:
          type: string
          enum: [pending, active, revoked]
        version:
          type: string
        capabilities:
          type: array
          items:
            type: string
        remote:
          type: string
          description: Source address of the last connection.
        paired_by:
          type: string
          format: uuid
        connected:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time

    AgentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Agent"

    AgentToken:
      type: object
      required: [token, expires_at, panel_fingerprint, compose]
      properties:
        token:
          type: string
          description: Shown only once; stored only as hash.
        expires_at:
          type: string
          format: date-time
        panel_addr:
          type: string
          description: RCD_AGENT_PUBLIC_ADDR; empty when not configured.
        panel_fingerprint:
          type: string
        compose:
          type: string
          description: Compose service for the agent with the token filled in.

    User:
      type: object
      required: [id, pseudonym, role, contacts, has_avatar, disabled, is_emergency, supporters_allowed, created_at, totp_enabled, email_set]
      properties:
        totp_enabled:
          type: boolean
          description: The second factor is on (AUTH-008).
        email_set:
          type: boolean
          description: An address for the recovery is on file; the address itself only its owner reads.
        id:
          type: string
          format: uuid
        pseudonym:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        real_name:
          type: string
        contacts:
          type: object
          additionalProperties:
            type: string
          description: Contact details such as telegram or whatsapp (AUTH-009).
        has_avatar:
          type: boolean
        disabled:
          type: boolean
        is_emergency:
          type: boolean
        supporters_allowed:
          type: boolean
          description: The moderator may have supporters (ROLE-006).
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: string
          format: date-time

    UserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"

    PlayerList:
      type: object
      required: [available, players, stale]
      properties:
        available:
          type: boolean
          description: The game profile defines a player list.
        players:
          type: array
          description: Player names; foreign data (SEC-006).
          items:
            type: string
        updated_at:
          type: string
          format: date-time
        stale:
          type: boolean

    CommandInput:
      type: object
      required: [command]
      properties:
        command:
          type: string
          minLength: 1
          maxLength: 10000

    CommandResult:
      type: object
      required: [request_id, ts, command, response, truncated]
      properties:
        request_id:
          type: string
          format: uuid
        ts:
          type: string
          format: date-time
        command:
          type: string
          description: The command as sent, after cleaning.
        response:
          type: string
          description: Foreign data from the game server (SEC-006).
        truncated:
          type: boolean
          description: The answer was longer than 64 KiB and is cut.

    MultiCommandInput:
      type: object
      additionalProperties: false
      required: [server_ids, command]
      properties:
        server_ids:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: string
            format: uuid
        command:
          type: string
          minLength: 1
          maxLength: 10000

    MultiCommandResult:
      type: object
      required: [batch_id, items]
      properties:
        batch_id:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: "#/components/schemas/MultiCommandItem"

    MultiCommandItem:
      type: object
      required: [server_id, result]
      properties:
        server_id:
          type: string
          format: uuid
        request_id:
          type: string
          format: uuid
          description: Missing for not_found.
        result:
          type: string
          enum: [ok, denied, error, timeout, not_found]
        reason:
          $ref: "#/components/schemas/ReasonCode"
        detail:
          type: string
        command:
          type: string
          description: The command as sent, after cleaning.
        response:
          type: string
          description: Foreign data from the game server (SEC-006).
        truncated:
          type: boolean

    HistoryEntry:
      type: object
      required: [request_id, ts, command, result]
      properties:
        request_id:
          type: string
          format: uuid
        ts:
          type: string
          format: date-time
        user_id:
          type: string
          format: uuid
        pseudonym:
          type: string
        role:
          type: string
        command:
          type: string
        response:
          type: string
        truncated:
          type: boolean
        result:
          type: string
          enum: [ok, denied, error, timeout]
        reason:
          type: string

    HistoryPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/HistoryEntry"
        next_cursor:
          type: string

    Server:
      type: object
      required: [id, name, groups, status, status_since, version]
      properties:
        version:
          type: string
          description: >-
            Version of the stored object for optimistic locking, raised
            by every change; send it as If-Match when changing the object
            (revision 2.4 candidate 24).
        status:
          type: string
          enum: [connected, auth_failed, offline, cert_mismatch]
          description: >-
            Reachability of the game server (SRV-004); cert_mismatch: a
            server with an HTTPS API shows another certificate than the
            trusted one, nothing is sent to it (PROT-003).
        status_since:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        name:
          type: string
        profile_id:
          type: string
          format: uuid
        groups:
          type: array
          items:
            type: string
            format: uuid
        protocol:
          type: string
          description: Admins only.
        host:
          type: string
          description: Admins only.
        port:
          type: integer
          description: Admins only.
        credentials:
          type: string
          enum: [ok, missing, reenter]
          description: >-
            Admins only. reenter: the credentials were encrypted with
            another master key and must be entered again (SRV-002).
        agent_id:
          type: string
          description: Admins only; the paired agent on the server's host.
        container_name:
          type: string
          description: >-
            Admins only; the container on that host. The agent resolves the
            name and checks its label for every order.
        runtime:
          $ref: "#/components/schemas/ServerRuntime"
        game_ports:
          type: array
          description: Admins only; the override of the server or the profile's ports (SRV-005).
          items:
            $ref: "#/components/schemas/GamePort"
        game_ports_override:
          type: boolean
        tls_fingerprint:
          type: string
          description: >-
            Admins only; the trusted certificate of a server with an HTTPS
            API (protocol http-api), SHA-256 in hex (PROT-003, D-071).

    ServerList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Server"

    ServerInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        profile_id:
          type: string
          format: uuid
        host:
          type: string
          minLength: 1
          maxLength: 253
        port:
          type: integer
          minimum: 1
          maximum: 65535
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 512
          description: >-
            RCON password, or the API token of a server with an HTTPS API;
            stored encrypted, never returned.
        game_ports:
          type: array
          description: Overrides the profile's game ports; an empty list returns to them.
          items:
            $ref: "#/components/schemas/GamePort"
        agent_id:
          type: string
          maxLength: 36
          description: An active agent; empty clears agent and container (SRV-001).
        container_name:
          type: string
          maxLength: 255
          description: Container name on the agent's host; set together with agent_id.
        tls_fingerprint:
          type: string
          maxLength: 128
          description: >-
            Trusts the certificate of a server with an HTTPS API, as the
            connection test showed it; required for protocol http-api
            (PROT-003, D-071). Colons and upper case are accepted.

    ConnectionTest:
      type: object
      properties:
        server_id:
          type: string
          format: uuid
          description: The server being edited; missing when a new one is created.
        profile_id:
          type: string
          format: uuid
        host:
          type: string
          minLength: 1
          maxLength: 253
        port:
          type: integer
          minimum: 1
          maximum: 65535
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 512
        tls_fingerprint:
          type: string
          maxLength: 128
          description: >-
            The certificate to trust for this test of a server with an
            HTTPS API; without it the stored one counts. Without any, the
            test only reads the certificate and sends no request.

    ConnectionTestResult:
      type: object
      required: [result]
      properties:
        result:
          type: string
          enum: [ok, auth_failed, unreachable, unpinned, cert_mismatch]
          description: >-
            unpinned: no certificate is trusted yet, the test only read it;
            cert_mismatch: the server shows another certificate than the
            trusted one, nothing was sent (PROT-003, D-071).
        fingerprint:
          type: string
          description: The certificate the server showed (http-api only), SHA-256 in hex.

    ServerRuntime:
      type: object
      description: >-
        Runtime data, kept in memory with its age (NFR-005); the same data
        comes live in servers.overview with kind runtime. Player count for
        everyone in scope, the container only for RCON admin and server
        admin (UI-006).
      required: [kind, server_id]
      properties:
        kind:
          type: string
          enum: [runtime]
        server_id:
          type: string
          format: uuid
        players:
          type: integer
        players_at:
          type: string
          format: date-time
        players_stale:
          type: boolean
        game_version:
          type: string
          maxLength: 64
          description: >-
            Game version the agent found in the container's logs with the
            profile's version pattern (AGT-006); a server datum for every
            role that sees the server (UI-006). Missing without a match,
            without a pattern or with an agent that does not report
            version.detect (AGT-013). Valid until the container starts
            again or its image changes. Foreign data (SEC-006).
        container:
          $ref: "#/components/schemas/ContainerRuntime"

    ContainerRuntime:
      type: object
      required: [name, state, restart_count, restart_loop, stale, agent_connected]
      properties:
        name:
          type: string
        image:
          type: string
          description: Foreign data from the agent (SEC-006).
        state:
          type: string
          description: Docker state, or unknown while the agent is disconnected.
        started_at:
          type: string
          format: date-time
        restart_count:
          type: integer
        restart_loop:
          type: boolean
          description: At least three starts within ten minutes (UI-003).
        cpu_percent:
          type: number
          format: double
        mem_bytes:
          type: integer
          format: int64
        mem_limit:
          type: integer
          format: int64
        metrics_at:
          type: string
          format: date-time
        stale:
          type: boolean
        agent_connected:
          type: boolean
        capabilities:
          type: array
          items:
            type: string
          description: >-
            Capabilities the agent reported when it connected last
            (AGT-013), such as container.action, logs and metrics; missing
            while the panel has not seen the agent since its start. Like the
            rest of the container part only for RCON admin and server admin
            in scope (AGT-008, UI-006). Foreign data from the agent
            (SEC-006).
        volumes:
          type: array
          items:
            $ref: "#/components/schemas/VolumeRuntime"
          description: >-
            Named volumes of the container (AGT-007); the size only once the
            agent measured it, without the capability volumes.size never.
        ports:
          type: array
          items:
            $ref: "#/components/schemas/PortRuntime"
          description: >-
            Ports of the container (UI-005): the server admin gets the game
            ports, the RCON admin also the RCON port and every other
            published port.

    PortRuntime:
      type: object
      required: [kind, private, proto]
      properties:
        kind:
          type: string
          enum: [game, rcon, other]
        name:
          type: string
          description: Name of a game port from the profile or the server.
        private:
          type: integer
          description: Port inside the container.
        public:
          type: integer
          description: Port on the host; missing when the port is not published.
        proto:
          type: string
          description: Foreign data from the agent for other ports (SEC-006).
        steam_url:
          type: string
          description: >-
            steam://connect link to the published game port, when the
            profile sets ports.steam_connect; host is the server's host.

    VolumeRuntime:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Foreign data from the agent (SEC-006).
        size_bytes:
          type: integer
          format: int64
          description: Used size, measured in the background every agent.volume_interval.
        measured_at:
          type: string
          format: date-time
          description: When the size was measured; the display names its age.
        stale:
          type: boolean
          description: The size is older than agent.volume_stale.

    ServerActionInput:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [start, stop, restart]

    ServerActionResult:
      type: object
      required: [action, via]
      properties:
        action:
          type: string
          enum: [start, stop, restart]
        via:
          type: string
          enum: [agent, rcon]
          description: rcon is the restart without agent (AGT-009).

    ServerGroup:
      type: object
      required: [id, name, server_ids, version]
      properties:
        version:
          type: string
          description: >-
            Version of the stored object for optimistic locking, raised
            by every change; send it as If-Match when changing the object
            (revision 2.4 candidate 24).
        id:
          type: string
          format: uuid
        name:
          type: string
        server_ids:
          type: array
          items:
            type: string
            format: uuid

    ServerGroupList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ServerGroup"

    ServerGroupInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        server_ids:
          type: array
          items:
            type: string
            format: uuid

    ProfileParam:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [player, text, choice, number]
        optional:
          type: boolean
        values:
          type: array
          items:
            type: string
        min:
          type: integer
        max:
          type: integer

    AgentContainers:
      type: object
      required: [connected, items]
      properties:
        connected:
          type: boolean
        items:
          type: array
          items:
            type: object
            required: [name, state]
            properties:
              name:
                type: string
              image:
                type: string
              state:
                type: string

    LogTail:
      type: object
      required: [server_id, container, lines, truncated]
      properties:
        server_id:
          type: string
          format: uuid
        container:
          type: string
        lines:
          type: array
          description: Foreign data from the container (SEC-006).
          items:
            type: string
        truncated:
          type: boolean
          description: Lines or the whole were cut to the limits.
        current:
          type: boolean
          description: >-
            The last lines, sent to a new subscriber; the client may hold them
            already.

    AllowedCommands:
      type: object
      required: [free_input, commands]
      properties:
        free_input:
          type: boolean
        commands:
          type: array
          items:
            $ref: "#/components/schemas/CatalogCommand"
        player_pattern:
          type: string
          description: >-
            RE2 pattern a player parameter must match as a whole
            (syntax.player_pattern of the game profile). Without it a
            player must not start with @ nor hold quotes or control
            characters (revision 2.4 candidate 19).

    CatalogCommand:
      type: object
      required: [path, description, params]
      properties:
        path:
          type: string
        description:
          type: string
        params:
          type: array
          items:
            $ref: "#/components/schemas/ProfileParam"

    Favorites:
      type: object
      required: [server_ids]
      properties:
        server_ids:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid

    GamePort:
      type: object
      required: [port, proto, name]
      properties:
        port:
          type: integer
        proto:
          type: string
          enum: [tcp, udp]
        name:
          type: string

    GameProfile:
      type: object
      required: [id, slug, name, kind, protocol, default_port, overridden, imported_at, case_sensitive, strip_prefix, max_length, wrappers, game_ports, catalog]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [generic, specific]
          description: >-
            generic for a game as such, specific for a modpack or plugin
            that ranks above it (CAT-007); a profile without kind is
            generic.
        protocol:
          type: string
        default_port:
          type: integer
        overridden:
          type: boolean
          description: A custom profile replaces the shipped one.
        imported_at:
          type: string
          format: date-time
        case_sensitive:
          type: boolean
        strip_prefix:
          type: string
        max_length:
          type: integer
        wrappers:
          type: array
          items:
            type: string
        game_ports:
          type: array
          items:
            $ref: "#/components/schemas/GamePort"
        catalog:
          type: array
          items:
            $ref: "#/components/schemas/CatalogCommand"
        last_error:
          type: string
          description: Reason of the last rejected file; RCON admin only.
        last_error_at:
          type: string
          format: date-time

    ProfileList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GameProfile"

    AuditEntry:
      type: object
      required: [id, ts, kind, action, payload, result]
      properties:
        id:
          type: string
          format: uuid
          description: For commands also the request ID (Design 4.1).
        ts:
          type: string
          format: date-time
        kind:
          type: string
          enum: [command, agent, admin, auth]
        actor_id:
          type: string
          format: uuid
        actor_role:
          type: string
        session:
          type: string
          description: First 8 characters of the session hash.
        server_id:
          type: string
          format: uuid
        target_type:
          type: string
        target_id:
          type: string
        action:
          type: string
        payload:
          type: object
          additionalProperties: true
        result:
          type: string
          enum: [ok, denied, error, timeout]
        reason:
          type: string

    AuditPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        next_cursor:
          type: string

    Settings:
      type: object
      additionalProperties: true
      description: Setting key to JSON value.

    SecondFactorRequired:
      type: object
      required: [second_factor, expires_at]
      properties:
        second_factor:
          type: string
          enum: [totp]
        expires_at:
          type: string
          format: date-time

    CodeInput:
      type: object
      required: [code]
      properties:
        code:
          type: string
          maxLength: 16
          description: The 6 digits of the authenticator app; spaces are ignored.

    PasswordConfirm:
      type: object
      required: [password]
      properties:
        password:
          type: string
          format: password
          writeOnly: true
          maxLength: 512
        code:
          type: string
          maxLength: 16
          description: Required while the second factor is on.

    EmailInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          maxLength: 254
          description: One plain address; empty removes it.
        password:
          type: string
          format: password
          writeOnly: true
          maxLength: 512
        code:
          type: string
          maxLength: 16

    SecondFactor:
      type: object
      required: [enabled, required, email]
      properties:
        enabled:
          type: boolean
        required:
          type: boolean
          description: The RCON admin requires it for everyone (auth.totp_required).
        email:
          type: string
          description: The own address for the recovery; only its owner reads it.

    SecondFactorSetup:
      type: object
      required: [secret, uri]
      properties:
        secret:
          type: string
          description: Base32, to type into the authenticator app.
        uri:
          type: string
          description: otpauth URI for the QR code, made in the browser.

    RecoveryRequest:
      type: object
      required: [pseudonym]
      properties:
        pseudonym:
          type: string
          maxLength: 256

    RecoveryRedeem:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          maxLength: 128
        password:
          type: string
          format: password
          writeOnly: true
          maxLength: 512

    SMTPSettings:
      type: object
      required: [host, port, encryption, username, password_set, from, version]
      properties:
        host:
          type: string
        port:
          type: integer
        encryption:
          type: string
          enum: [none, starttls, ssl]
        username:
          type: string
        password_set:
          type: boolean
          description: Whether a password is stored; the password itself is never returned.
        from:
          type: string
          description: Sender address.
        version:
          type: string
          description: Version for If-Match.

    SMTPSettingsInput:
      type: object
      properties:
        host:
          type: string
          maxLength: 253
        port:
          type: integer
          minimum: 1
          maximum: 65535
        encryption:
          type: string
          enum: [none, starttls, ssl]
        username:
          type: string
          maxLength: 256
        password:
          type: string
          format: password
          writeOnly: true
          maxLength: 512
          description: Write-only; an empty string removes the password.
        from:
          type: string
          maxLength: 254

    SMTPTestInput:
      type: object
      required: [to]
      properties:
        to:
          type: string
          maxLength: 254
          description: One plain mail address.

    SMTPTestResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        category:
          type: string
          enum: [auth, tls, connect, timeout, rejected]
          description: Why the mail did not go out; nothing more is told.

    ProfileUpdate:
      type: object
      properties:
        pseudonym:
          type: string
          minLength: 2
          maxLength: 32
        real_name:
          type: string
          maxLength: 64
          description: An empty string removes the real name.
        contacts:
          type: object
          maxProperties: 8
          additionalProperties:
            type: string
            maxLength: 128

    PasswordReset:
      type: object
      required: [password]
      properties:
        password:
          type: string
          description: Temporary password; shown only once.

    PasswordChange:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 1024
        new_password:
          type: string
          minLength: 12
          maxLength: 1024

    Invite:
      type: object
      required: [id, created_by, role, created_at, expires_at]
      properties:
        id:
          type: string
          format: uuid
        created_by:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/Role"
        template_user_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        used_at:
          type: string
          format: date-time
        used_by:
          type: string
          format: uuid

    InviteList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Invite"

    InviteCreate:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/Role"
        template_user_id:
          type: string
          format: uuid

    InviteCreated:
      type: object
      required: [invite, token, url]
      properties:
        invite:
          $ref: "#/components/schemas/Invite"
        token:
          type: string
          description: Shown only once; stored only as hash.
        url:
          type: string
          description: Link for the invitee; the token is in the fragment, so it reaches no server log.

    InviteRedeem:
      type: object
      required: [token, pseudonym, password]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
        pseudonym:
          type: string
          minLength: 2
          maxLength: 32
        password:
          type: string
          minLength: 12
          maxLength: 1024

    CommandListEntry:
      type: object
      required: [path, passable]
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 256
          description: Token path such as "whitelist add" (CMD-004).
        passable:
          type: boolean
          description: May be passed on to supporters (ROLE-007).

    CommandList:
      type: object
      required: [id, name, owner_id, entries, version]
      properties:
        version:
          type: string
          description: >-
            Version of the stored object for optimistic locking, raised
            by every change; send it as If-Match when changing the object
            (revision 2.4 candidate 24).
        id:
          type: string
          format: uuid
        name:
          type: string
        owner_id:
          type: string
          format: uuid
        entries:
          type: array
          items:
            $ref: "#/components/schemas/CommandListEntry"

    Template:
      type: object
      required: [id, server_id, name, template, placeholders, version]
      properties:
        id:
          type: string
          format: uuid
        server_id:
          type: string
          format: uuid
        name:
          type: string
        template:
          type: string
          description: The command with placeholders such as {player}.
        placeholders:
          type: array
          description: Names of the placeholders in order, each once.
          items:
            type: string
        version:
          type: string
          description: >-
            Version of the stored object for optimistic locking; send it
            as If-Match when changing the template.

    TemplateList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Template"

    TemplateInput:
      type: object
      required: [name, template]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        template:
          type: string
          minLength: 1
          maxLength: 4096

    TemplateUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        template:
          type: string
          minLength: 1
          maxLength: 4096

    CommandListList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CommandList"

    CommandListCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        entries:
          type: array
          items:
            $ref: "#/components/schemas/CommandListEntry"

    CommandListUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        entries:
          type: array
          items:
            $ref: "#/components/schemas/CommandListEntry"

    GroupKind:
      type: string
      enum: [general, moderator]

    UserGroup:
      type: object
      required: [id, name, kind, owner_id, members, grants, version]
      properties:
        version:
          type: string
          description: >-
            Version of the stored object for optimistic locking, raised
            by every change; send it as If-Match when changing the object
            (revision 2.4 candidate 24).
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: "#/components/schemas/GroupKind"
        owner_id:
          type: string
          format: uuid
        command_list_id:
          type: string
          format: uuid
        members:
          type: array
          items:
            type: string
            format: uuid
        grants:
          type: array
          description: Servers and server groups for all members.
          items:
            $ref: "#/components/schemas/Target"

    UserGroupList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UserGroup"

    UserGroupCreate:
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        kind:
          $ref: "#/components/schemas/GroupKind"
        command_list_id:
          type: string
          format: uuid

    UserGroupUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        command_list_id:
          type: string
          description: A list ID, or an empty string to remove the list.
        members:
          type: array
          items:
            type: string
            format: uuid
        grants:
          type: array
          items:
            $ref: "#/components/schemas/Target"

    Target:
      type: object
      description: Exactly one of server_id or server_group_id.
      properties:
        server_id:
          type: string
          format: uuid
        server_group_id:
          type: string
          format: uuid

    Grant:
      type: object
      required: [group_id]
      description: >-
        A server or server group for a moderator through one of his
        moderator groups, whose list applies (Design 4.3).
      properties:
        group_id:
          type: string
          format: uuid
        server_id:
          type: string
          format: uuid
        server_group_id:
          type: string
          format: uuid

    SupporterGrant:
      type: object
      required: [moderator_id, server_id]
      properties:
        moderator_id:
          type: string
          format: uuid
        server_id:
          type: string
          format: uuid

    Assignments:
      type: object
      required: [role, admin_scopes, groups, grants, supporter_grants]
      properties:
        role:
          $ref: "#/components/schemas/Role"
        admin_scopes:
          type: array
          items:
            $ref: "#/components/schemas/Target"
        groups:
          type: array
          items:
            type: string
            format: uuid
        grants:
          type: array
          items:
            $ref: "#/components/schemas/Grant"
        supporter_grants:
          type: array
          items:
            $ref: "#/components/schemas/SupporterGrant"

    AssignmentsUpdate:
      type: object
      properties:
        admin_scopes:
          type: array
          items:
            $ref: "#/components/schemas/Target"
        groups:
          type: array
          items:
            type: string
            format: uuid
        grants:
          type: array
          items:
            $ref: "#/components/schemas/Grant"
        supporter_grants:
          type: array
          items:
            $ref: "#/components/schemas/SupporterGrant"

    UserUpdate:
      type: object
      properties:
        role:
          $ref: "#/components/schemas/Role"
        disabled:
          type: boolean
        supporters_allowed:
          type: boolean
          description: >-
            Release supporters for a moderator (ROLE-006); only server
            admins and the RCON admin. Switching off takes the rights of
            the moderator's supporters.

    Role:
      type: string
      description: One of the four fixed roles (ROLE-001).
      enum: [rcon_admin, server_admin, moderator, supporter]

    LoginRequest:
      type: object
      required: [pseudonym, password]
      properties:
        pseudonym:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 1024

    SessionUser:
      type: object
      required: [id, pseudonym, role]
      properties:
        id:
          type: string
          format: uuid
        pseudonym:
          type: string
        role:
          $ref: "#/components/schemas/Role"

    Session:
      type: object
      required: [user, expires_at, must_change_password, totp_setup_required, ui, panel_version]
      properties:
        totp_setup_required:
          type: boolean
          description: >-
            The RCON admin requires the second factor and the user has none:
            only setting it up, logging out and reading the session work,
            and no WebSocket subscription (AUTH-008).
        panel_version:
          type: string
          description: >-
            Version of the panel (UI-015), e.g. 0.10; 0.0.0-dev in
            development builds.
        ui:
          type: object
          description: >-
            Global interface settings everyone needs (revision 2.4
            candidate 7); only the RCON admin changes them in /settings.
          required: [shortcuts_enabled, supporters_enabled, supporters_allowed]
          properties:
            shortcuts_enabled:
              type: boolean
              description: Keyboard shortcuts, off by default (UI-008).
            supporters_enabled:
              type: boolean
              description: >-
                The global supporter switch (ROLE-006); with the user's own
                release it decides whether a moderator manages supporters
                (Design 6.2).
            supporters_allowed:
              type: boolean
              description: >-
                The user's own supporter release (moderators); with
                supporters_enabled it shows whether he manages supporters.
                The interface needs nothing else to hide entries.
        must_change_password:
          type: boolean
          description: >-
            Until the password is changed only /me/password, /auth/logout
            and /auth/session are allowed (AUTH-010).
        user:
          $ref: "#/components/schemas/SessionUser"
        expires_at:
          type: string
          format: date-time
          description: >-
            End of the session unless it is used again; it also ends after
            the maximum lifetime.

    ReasonCode:
      type: string
      description: Machine-readable reason of a rejection (Design 3.5).
      enum:
        - unauthenticated
        - not_found
        - not_in_list
        - wrapper_blocked
        - invalid
        - rate_limited
        - server_unavailable
        - forbidden
        - busy
        - password_change_required
        - timeout
        - agent_unavailable
        - agent_unsupported
        - action_failed
        - conflict
        - precondition_required
        - totp_setup_required

    Problem:
      type: object
      description: Problem Details for HTTP APIs (RFC 9457).
      required: [type, title, status]
      properties:
        type:
          type: string
          description: URI reference identifying the problem type.
          default: about:blank
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
          description: Human-readable explanation of this occurrence.
        instance:
          type: string
          description: URI reference of this occurrence.
        reason:
          $ref: "#/components/schemas/ReasonCode"
        request_id:
          type: string
          description: Request ID of the call, also found in the logs.

  responses:
    BadRequest:
      description: The request body or parameters are malformed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: >-
        Not allowed, for example a write request without matching Origin
        header (Design 2.1).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: Too many attempts; Retry-After gives the wait in seconds.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Busy:
      description: >-
        The panel is busy (for example all password hashing slots are in
        use or the game server's command queue is full); retry after
        Retry-After seconds.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthenticated:
      description: No valid session.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Invalid:
      description: The request breaks a rule of the data.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource does not exist or is outside the caller's scope.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionRequired:
      description: >-
        A versioned write without If-Match (precondition_required,
        revision 2.4 candidate 24).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: >-
        The object changed since it was read: If-Match does not name its
        current version (conflict, revision 2.4 candidate 24).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: rcd_session
      description: >-
        Server-side session (Design 2.1, decision W1). The cookie is
        HttpOnly and SameSite=Lax. Over HTTPS it is named
        __Host-rcd_session and marked Secure; over plain HTTP it is named
        rcd_session.
