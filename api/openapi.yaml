# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Single source of the panel API (D-039). Server stubs are generated with
# oapi-codegen, client types with openapi-typescript. Extend this file
# before implementing an endpoint.
openapi: 3.1.0
info:
  title: RCONductor Panel API
  version: 1.0.0
  description: >-
    REST API between the browser and the panel (Design 2). In 1.0 it serves
    only the panel's own web UI. Errors use Problem Details (RFC 9457).
    Bodies over 256 KiB, a profile picture over 2 MiB, get 413 (Design 2.1).
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
servers:
  - url: /api/v1

# Every operation needs a session unless it says otherwise.
security:
  - session: []

# Endpoints are added per milestone (Design 2.2).
paths:
  /auth/login:
    post:
      operationId: login
      summary: Log in with pseudonym and password (AUTH-001, AUTH-006).
      description: >-
        Starts a new session and sets the session cookie. Wrong
        credentials, unknown users and disabled accounts get the same
        answer. With the second factor on (AUTH-008) the right password
        starts no session: the answer is 202 with the cookie rcd_pending
        for /auth/login/totp, and a session sent along stays until the
        code is right (D-052).
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in; the response sets the session cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "202":
          description: The password was right; the code of the second factor must follow.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecondFactorRequired"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Busy"
  /auth/login/totp:
    post:
      operationId: loginCode
      summary: Complete a login with the code of the second factor (AUTH-008).
      description: >-
        Needs the cookie rcd_pending of /auth/login: one use, valid for
        auth.second_factor_window, ended by 5 wrong codes, a lockout, a lock
        of the user or a change of the password. Wrong codes count to
        login.max_failures. Starts the session like /auth/login.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeInput"
      responses:
        "200":
          description: Logged in; the response sets the session cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Busy"
  /auth/recovery:
    post:
      operationId: requestRecovery
      summary: Ask for a recovery link of the second factor (AUTH-008).
      description: >-
        The answer is always the same, whether user and address exist or
        not. A user with an address and the second factor on gets a mail
        with a link valid for auth.recovery_lifetime; only the last link
        holds. At most auth.recovery_per_hour per user and per client. The
        mail goes out only with RCD_PUBLIC_URL set.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveryRequest"
      responses:
        "202":
          description: Taken; nothing tells whether a mail goes out.
        "400":
          $ref: "#/components/responses/BadRequest"
  /auth/recovery/redeem:
    post:
      operationId: redeemRecovery
      summary: Reset the second factor with the recovery link and the password (AUTH-008).
      description: >-
        Resets only: all sessions of the user end and the next login needs
        the password; nobody is signed in. The link holds once; wrong
        passwords count to the lockout.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveryRedeem"
      responses:
        "204":
          description: The second factor is off.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Busy"
  /auth/logout:
    post:
      operationId: logout
      summary: End the current session (AUTH-006).
      tags: [auth]
      responses:
        "204":
          description: Logged out; the response clears the session cookie.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /auth/session:
    get:
      operationId: getSession
      summary: The current session and its user (AUTH-006).
      tags: [auth]
      responses:
        "200":
          description: Current session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /me/second-factor:
    get:
      operationId: getSecondFactor
      summary: The own second factor and mail address (AUTH-008).
      tags: [me]
      responses:
        "200":
          description: The state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecondFactor"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /me/second-factor/setup:
    post:
      operationId: setupSecondFactor
      summary: Start the own second factor; needs the password (AUTH-008).
      description: >-
        Refused while a second factor is on. The secret waits until its
        first code confirms it.
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordConfirm"
      responses:
        "200":
          description: The new secret, to scan or type in.
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecondFactorSetup"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Busy"
  /me/second-factor/confirm:
    post:
      operationId: confirmSecondFactor
      summary: Switch the own second factor on with its first code (AUTH-008).
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeInput"
      responses:
        "204":
          description: The second factor is on.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
  /me/second-factor/disable:
    post:
      operationId: disableSecondFactor
      summary: Switch the own second factor off with password and code (AUTH-008).
      description: Refused while auth.totp_required is on.
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordConfirm"
      responses:
        "204":
          description: The second factor is off.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Busy"
  /me/email:
    put:
      operationId: setEmail
      summary: Change the own mail address for the recovery; needs the password and, with the second factor on, a code (AUTH-008).
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailInput"
      responses:
        "204":
          description: Changed; an empty address removes it.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Busy"
  /users/{id}/second-factor:
    parameters:
      - $ref: "#/components/parameters/UserID"
    delete:
      operationId: resetSecondFactor
      summary: Reset the second factor of a user; whoever manages the user (AUTH-008).
      description: >-
        Also with an address on file and without further input (D-050);
        audited, all sessions of the user end. Not for the emergency admin
        (AUTH-011).
      tags: [users]
      responses:
        "204":
          description: Reset.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /profiles:
    get:
      operationId: listProfiles
      summary: Game profiles with their command catalog (CAT-001, CAT-002).
      description: >-
        The catalog is orientation only and allows or forbids nothing.
        last_error is shown to the RCON admin only (health overview).
      tags: [profiles]
      responses:
        "200":
          description: All imported profiles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /servers:
    get:
      operationId: listServers
      summary: Servers in the caller's scope (ROLE-003).
      description: >-
        RCON admin and server admins see connection fields and the state
        of the credentials; moderators and supporters see name, profile
        and groups. The password is never returned.
      tags: [servers]
      responses:
        "200":
          description: The servers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: createServer
      summary: Add a game server; RCON admin only (SRV-001).
      tags: [servers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServerInput"
      responses:
        "201":
          description: The new server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Server"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Invalid"
  /servers/test-connection:
    post:
      operationId: testServerConnection
      summary: Test RCON data without saving; RCON admin only (SRV-007).
      description: >-
        With server_id and unchanged host, port and password (an empty
        password counts as unchanged) the answer is the status of the
        running connection, nothing connects. New or changed data open a
        short connection that only authenticates and closes at once. With
        server_id an empty password means the stored one, also at a new
        address (D-050); without server_id it is refused. Limited per user.
        No data of the game server comes back.
      tags: [servers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionTest"
      responses:
        "200":
          description: The result of the test.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionTestResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/RateLimited"
  /servers/{id}:
    parameters:
      - $ref: "#/components/parameters/ServerID"
    get:
      operationId: getServer
      summary: A server in the caller's scope; others answer 404 (Design 3.1).
      tags: [servers]
      responses:
        "200":
          description: The server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Server"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateServer
      summary: Change a server; a password replaces the stored one, a new host or port keeps it (D-050); RCON admin only.
      tags: [servers]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServerInput"
      responses:
        "409":
          $ref: "#/components/responses/Conflict"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "200":
          description: The changed server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Server"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
    delete:
      operationId: deleteServer
      summary: Delete a server (soft delete); RCON admin only.
      tags: [servers]
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /servers/{id}/commands:
    parameters:
      - $ref: "#/components/parameters/ServerID"
    get:
      operationId: listAllowedCommands
      summary: Commands the caller may send on the server (CMD-003, CMD-015).
      description: >-
        Moderators and supporters get the paths of the list that applies to
        them, with the catalog entry of the profile where one exists
        (description and parameters); a path without catalog entry has no
        parameters and takes the rest of the line. RCON admin and server
        admin get free_input and the whole catalog, for completion.
        Orientation only: the pipeline checks every command again.
      tags: [commands]
      responses:
        "200":
          description: The allowed commands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllowedCommands"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: sendCommand
      summary: Send a command over the server's one RCON connection (Design 3.3).
      description: >-
        RCON admin and server admin may send any command (CMD-002);
        moderators and supporters only commands of the list that applies
        to them on this server, never wrappers (CMD-004, CMD-005). For
        them a command with catalog entry must also fit its parameters
        (player a name after the profile's player_pattern, never a
        selector such as @a; choice one of its values; number a whole
        number in range; text the rest; required ones present; further
        arguments only after a text parameter), else 422 invalid with
        the parameter in the detail (revision 2.4 candidate 19);
        commands without catalog entry pass as they are. The
        answer comes synchronously and as event to the console; the
        request ID is also the ID of the first audit entry (CMD-007).
        The command has 10 s from its acceptance, the wait in the
        server's queue included, then 504 timeout; a full queue answers
        503 busy at once, no RCON connection 503 server_unavailable
        (Design 3.8).
      tags: [commands]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandInput"
      responses:
        "200":
          description: The game server's answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Busy"
        "504":
          description: The game server did not answer in time.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /servers/{id}/templates:
    parameters:
      - $ref: "#/components/parameters/ServerID"
    get:
      operationId: listTemplates
      summary: Command templates of the server (CMD-008).
      description: >-
        RCON admin and server admin in scope get all templates of the
        server. Moderators and supporters get only templates whose fixed
        part, the tokens before the first placeholder, is allowed by the
        list that applies to them, matched by whole tokens like a command
        (CMD-004). Orientation only: the interface fills the placeholders
        and sends the command through POST /servers/{id}/commands, where
        the pipeline checks it like a typed one (D-068).
      tags: [commands]
      responses:
        "200":
          description: The templates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createTemplate
      summary: Create a command template; RCON admin, server admin in scope.
      description: >-
        Placeholders are {name} with a lower-case name; the first token is
        fixed text. The name is unique per server among templates that are
        not deleted. A server has at most commands.templates_per_server
        templates.
      tags: [commands]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateInput"
      responses:
        "201":
          description: The new template.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
  /servers/{id}/templates/{template_id}:
    parameters:
      - $ref: "#/components/parameters/ServerID"
      - $ref: "#/components/parameters/TemplateID"
    get:
      operationId: getTemplate
      summary: One template, for whoever may see it (D-068).
      tags: [commands]
      responses:
        "200":
          description: The template.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateTemplate
      summary: Change name or text of a template.
      tags: [commands]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateUpdate"
      responses:
        "200":
          description: The changed template.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Invalid"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
    delete:
      operationId: deleteTemplate
      summary: Delete a template (soft delete).
      tags: [commands]
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /commands/multi:
    post:
      operationId: sendMultiCommand
      summary: Send one command to several servers at once (CMD-010, D-069).
      description: >-
        Only RCON admin and server admin. Every server gets a normal run
        of the pipeline (Design 3.3) with its own request ID: scope, the
        syntax of its profile, the rate limit of the bucket (user, server)
        as for a single command, audit and console. A server outside the
        scope and an unknown ID both give not_found. The panel makes the
        batch_id that ties the runs together in the audit; a batch_id or
        any other unknown field in the request is refused with 400. Up to
        commands.multi_max_servers servers, commands.multi_parallel at a
        time; the answer comes when every server has its result.
      tags: [commands]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MultiCommandInput"
      responses:
        "200":
          description: The result per server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MultiCommandResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Invalid"
  /servers/{id}/players:
    parameters:
      - $ref: "#/components/parameters/ServerID"
    get:
      operationId: getPlayers
      summary: Players online, from the cache (SRV-006, Overview 4.6).
      description: >-
        Fetched over RCON with the profile's player command when missing
        or older than 120 s; kept in memory only. A value that could not
        be refreshed comes back marked stale with its time.
      tags: [servers]
      responses:
        "200":
          description: The player list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Busy"
  /servers/{id}/history:
    parameters:
      - $ref: "#/components/parameters/ServerID"
    get:
      operationId: getHistory
      summary: Command history of a server, newest first (Design 2.2).
      description: >-
        Visible by role (ROLE-009, D-067): the RCON admin sees all
        commands; a server admin those of server admins, moderators and
        supporters; moderators and supporters those of each other, never
        those of server admins or RCON admins. The author counts with his
        role at the time of the command. own=true keeps only the caller's
        own; no other parameter widens what a role sees.
      tags: [commands]
      parameters:
        - name: own
          in: query
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 256
      responses:
        "200":
          description: A page of the history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
  /servers/{id}/actions:
    parameters:
      - $ref: "#/components/parameters/ServerID"
    post:
      operationId: serverAction
      summary: Start, stop or restart the server's container (AGT-003, AGT-008, AGT-009).
      description: >-
        RCON admin everywhere, server admin in his scope; moderators and
        supporters never (403). With an agent the order goes to it and
        the agent checks the label again; without an agent only restart
        works, by the profile's stop command over RCON and the container's
        restart policy unless-stopped. Without a connected agent (or for
        start and stop without agent) the answer is 503 agent_unavailable;
        a connected agent that does not report the capability
        container.action answers 409 agent_unsupported (AGT-013). Every
        action is audited.
      tags: [servers]
      requestBody:
