      summary: Create a pairing token (way A, AGT-005); RCON admin only.
      description: >-
        The token is valid once for 24 h and returned only now, with a
        ready Compose service for the agent. It carries the panel address
        (RCD_AGENT_PUBLIC_ADDR) and the fingerprint of the panel key; with
