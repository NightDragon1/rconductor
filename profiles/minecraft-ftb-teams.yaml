# SPDX-License-Identifier: AGPL-3.0-or-later

schema: 1
id: minecraft-ftb-teams
name: FTB Teams
kind: specific
researched_version: "2001.3.2 (MC 1.20.1)"
sources:
  - "https://github.com/FTBTeam/FTB-Teams/blob/1.20.1/main/common/src/main/java/dev/ftb/mods/ftbteams/data/FTBTeamsCommands.java"
status: untested
# Layer on minecraft-forge or minecraft-neoforge.
protocol:
  type: source-rcon
  default_port: 25575
catalog:
  - path: ftbteams list
    description: List teams
    params:
      - { name: type, type: choice, values: [parties, server_teams, players], optional: true }
  - path: ftbteams info
    description: Show information about a team
    params:
      - { name: team, type: text, optional: true }
  - path: ftbteams info server_id
    description: Show the server id
  - path: ftbteams server create
    description: Create a server team
    params:
      - { name: name, type: text }
  - path: ftbteams force-disband
    description: Disband a party team
    params:
      - { name: team, type: text }
