# SPDX-License-Identifier: AGPL-3.0-or-later

schema: 1
id: minecraft-java
name: Minecraft (Java Edition)
match:
  images: ["itzg/minecraft-server*"]
protocol:
  type: source-rcon
  default_port: 25575
ports:
  game:
    - { port: 25565, proto: tcp, name: game }
syntax:
  case_sensitive: false
  strip_prefix: "/"
  max_length: 1000
  wrappers: [execute]
  # Java Edition names; selectors such as @a never fit (revision 2.4
  # candidate 19).
  player_pattern: "^[A-Za-z0-9_]{1,16}$"
players:
  command: list
  pattern: "players online:\\s*(.*)$"
  separator: ", "
stop:
  command: stop
version:
  pattern: "Starting minecraft server version (\\S+)"
formatting: minecraft
catalog:
  # --- Players ---
  - path: list
    description: Show players online
  - path: whitelist add
    description: Add a player to the whitelist
    params:
      - { name: player, type: player }
  - path: whitelist remove
    description: Remove a player from the whitelist
    params:
      - { name: player, type: player }
  - path: whitelist list
    description: Show the whitelist
  - path: whitelist
    description: Toggle or reload the whitelist
    params:
      - { name: action, type: choice, values: [on, off, reload] }
  - path: kick
    description: Kick a player from the server
    params:
      - { name: player, type: player }
      - { name: reason, type: text, optional: true }
  - path: ban
    description: Ban a player
    params:
      - { name: player, type: player }
      - { name: reason, type: text, optional: true }
  - path: pardon
    description: Unban a player
    params:
      - { name: player, type: player }
  - path: ban-ip
    description: Ban an IP address or the IP of an online player
    params:
      - { name: target, type: text }
      - { name: reason, type: text, optional: true }
  - path: pardon-ip
    description: Unban an IP address
    params:
      - { name: ip, type: text }
  - path: banlist
    description: Show banned players or IPs
    params:
      - { name: type, type: choice, values: [players, ips], optional: true }
  - path: op
    description: Grant operator status
    params:
      - { name: player, type: player }
  - path: deop
    description: Revoke operator status
    params:
      - { name: player, type: player }
  - path: gamemode
    description: Set a player's game mode
    params:
      - { name: mode, type: choice, values: [survival, creative, adventure, spectator] }
      - { name: player, type: player }
  - path: tp
    description: Teleport a player to another player
    params:
      - { name: player, type: player }
      - { name: target, type: player }
  - path: give
    description: Give an item to a player (item as namespaced id, e.g. minecraft:diamond)
    params:
      - { name: player, type: player }
      - { name: item, type: text }
      - { name: count, type: text, optional: true }
  - path: clear
    description: Clear a player's inventory
    params:
      - { name: player, type: player }
  - path: effect clear
    description: Remove all status effects from a player
    params:
      - { name: player, type: player }
  - path: xp add
    description: Add experience to a player
    params:
      - { name: player, type: player }
      - { name: amount, type: text }
      - { name: unit, type: choice, values: [points, levels], optional: true }
  - path: kill
    description: Kill a player
    params:
      - { name: player, type: player }
  # --- World ---
  - path: time set
    description: Set the time of day
    params:
      - { name: time, type: choice, values: [day, noon, night, midnight] }
  - path: time add
    description: Advance time by ticks
    params:
      - { name: ticks, type: text }
  - path: weather
    description: Set the weather
    params:
      - { name: type, type: choice, values: [clear, rain, thunder] }
      - { name: duration, type: text, optional: true }
  - path: difficulty
    description: Set the difficulty
    params:
      - { name: level, type: choice, values: [peaceful, easy, normal, hard] }
  - path: defaultgamemode
    description: Set the default game mode for new players
    params:
      - { name: mode, type: choice, values: [survival, creative, adventure, spectator] }
  - path: gamerule
    description: Set a game rule (e.g. keepInventory true)
    params:
      - { name: rule, type: text }
      - { name: value, type: text, optional: true }
  - path: setworldspawn
    description: Set the world spawn point
    params:
      - { name: xyz, type: text, optional: true }
  - path: worldborder set
    description: Set the world border diameter
    params:
      - { name: size, type: text }
  - path: seed
    description: Show the world seed
  # --- Messaging ---
  - path: say
    description: Message to all players
    params:
      - { name: text, type: text }
  - path: msg
    description: Private message to a player
    params:
      - { name: player, type: player }
      - { name: text, type: text }
  - path: title
    description: Show a title on a player's screen (JSON text)
    params:
      - { name: player, type: player }
      - { name: position, type: choice, values: [title, subtitle, actionbar] }
      - { name: json, type: text }
  # --- Server ---
  - path: save-all
    description: Save the world to disk
    params:
      - { name: mode, type: choice, values: [flush], optional: true }
  - path: save-off
    description: Disable automatic world saving (before backups)
  - path: save-on
    description: Enable automatic world saving
  - path: reload
    description: Reload datapacks and server config
  - path: debug
    description: Start or stop the tick profiler
    params:
      - { name: action, type: choice, values: [start, stop] }
  - path: tick
    description: Query or set the tick rate (1.20.3+)
    params:
      - { name: action, type: choice, values: [query, rate, freeze, unfreeze] }
      - { name: value, type: text, optional: true }
