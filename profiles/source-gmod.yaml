schema: 1
id: source-gmod
name: Garry's Mod
kind: specific
sources:
  - "https://wiki.facepunch.com/gmod/Beginner_Tutorial_Intro"
  - "https://wiki.facepunch.com/gmod/Console_commands"
status: untested
# Layer on source-engine. Admin addons such as ULX run Lua or RCON as
# subcommands (ulx luarun, ulx rcon); the wrapper check sees only the
# first token, see INDEX.md.
protocol:
  type: source-rcon
  default_port: 27015
syntax:
  # Lua on the server; lua_run_cl and lua_openscript_cl reach clients.
  wrappers: [lua_run, lua_openscript, lua_run_cl, lua_openscript_cl]
