# SPDX-License-Identifier: AGPL-3.0-or-later

schema: 1
id: minecraft-ftb-quests
name: FTB Quests
kind: specific
researched_version: "2001.4.22 (MC 1.20.1)"
sources:
  - "https://github.com/FTBTeam/FTB-Quests/tree/1.20.1/main/common/src/main/java/dev/ftb/mods/ftbquests/command"
status: untested
# Layer on minecraft-forge or minecraft-neoforge. Note: completing a quest
# runs its command rewards, which the pack author defined.
protocol:
  type: source-rcon
  default_port: 25575
catalog:
  - path: ftbquests change_progress
    description: Reset or complete a quest object for players (players, reset|complete, quest id)
    params:
      - { name: player, type: player }
      - { name: action, type: choice, values: [reset, complete] }
      - { name: quest_object, type: text }
  - path: ftbquests editing_mode
    description: Switch quest editing mode for a player
    params:
      - { name: enabled, type: choice, values: ["true", "false"] }
      - { name: player, type: player, optional: true }
  - path: ftbquests locked
    description: Lock or unlock quest progress for a player's team
    params:
      - { name: enabled, type: choice, values: ["true", "false"] }
      - { name: player, type: player, optional: true }
  - path: ftbquests block_rewards
    description: Block or allow rewards for a player's team
    params:
      - { name: enabled, type: choice, values: ["true", "false"] }
      - { name: player, type: player, optional: true }
  - path: ftbquests reload
    description: Reload quests from disk
  - path: ftbquests delete_empty_reward_tables
    description: Delete reward tables without entries
  - path: ftbquests clear_item_display_cache
    description: Clear the item display cache
